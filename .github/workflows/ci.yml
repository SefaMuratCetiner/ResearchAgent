# Continuous integration: every push and pull request.
#   build        restore (locked), build with warnings as errors, format check, unit + architecture tests
#   integration  Postgres (pgvector) and RabbitMQ through Testcontainers (Docker is available on ubuntu runners)
#   e2e          the real AppHost under Aspire.Hosting.Testing; API tests on every push to main and on PRs,
#                the full Claude-backed research flow only when started by hand with run_full_flow
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_full_flow:
        description: Run the full research flow against Claude (uses the ANTHROPIC_API_KEY secret and costs tokens)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Locked restore and warnings as errors (Directory.Build.props).
  ContinuousIntegrationBuild: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Research.slnx

      - name: Build
        run: dotnet build Research.slnx -c Release --no-restore

      - name: Format
        run: dotnet format Research.slnx --verify-no-changes --no-restore

      - name: Unit tests
        run: dotnet test --project tests/Research.UnitTests/Research.UnitTests.csproj -c Release --no-build

      - name: Architecture tests
        run: dotnet test --project tests/Research.ArchitectureTests/Research.ArchitectureTests.csproj -c Release --no-build

  integration:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Integration tests
        run: dotnet test --project tests/Research.IntegrationTests/Research.IntegrationTests.csproj -c Release

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Trust the development certificate
        run: dotnet dev-certs https --trust

      - name: End-to-end tests
        env:
          # Empty unless started by hand with run_full_flow: the Claude-backed test then skips itself.
          ANTHROPIC_API_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_flow && secrets.ANTHROPIC_API_KEY || '' }}
        run: dotnet test --project tests/Research.EndToEndTests/Research.EndToEndTests.csproj -c Release
