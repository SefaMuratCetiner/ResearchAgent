# Delivery: on a version tag (v1.2.3), build one container image per service and the schema tool with the .NET SDK
# container support (no Dockerfiles) and push them to GitHub Container Registry. Deployment itself is out of scope
# for now (D22: local Aspire only); a deploy job is added here once a hosting target is chosen.
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ContinuousIntegrationBuild: true
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Research.slnx
      - run: dotnet build Research.slnx -c Release --no-restore
      - run: dotnet test --project tests/Research.UnitTests/Research.UnitTests.csproj -c Release --no-build
      - run: dotnet test --project tests/Research.ArchitectureTests/Research.ArchitectureTests.csproj -c Release --no-build
      - run: dotnet test --project tests/Research.IntegrationTests/Research.IntegrationTests.csproj -c Release --no-build

  images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: research-jobs
            project: src/Jobs/Research.Jobs.Host/Research.Jobs.Host.csproj
          - name: research-planning
            project: src/Planning/Research.Planning.Host/Research.Planning.Host.csproj
          - name: research-search
            project: src/Search/Research.Search.Host/Research.Search.Host.csproj
          - name: research-fetching
            project: src/Fetching/Research.Fetching.Host/Research.Fetching.Host.csproj
          - name: research-knowledge
            project: src/Knowledge/Research.Knowledge.Host/Research.Knowledge.Host.csproj
          - name: research-synthesis
            project: src/Synthesis/Research.Synthesis.Host/Research.Synthesis.Host.csproj
          - name: research-db-scripts
            project: tools/Research.DbScripts/Research.DbScripts.csproj
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=0.0.0-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish image
        run: >
          dotnet publish ${{ matrix.project }}
          -c Release
          -t:PublishContainer
          -p:EnableSdkContainerSupport=true
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository=${{ github.repository_owner }}/${{ matrix.name }}
          -p:ContainerImageTags='"${{ steps.version.outputs.tag }};latest"'
          -p:Version=${{ steps.version.outputs.tag }}
