version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      aspire:
        patterns: ["Aspire.*"]
      opentelemetry:
        patterns: ["OpenTelemetry.*"]
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*", "Microsoft.AspNetCore.*"]
      tests:
        patterns: ["xunit.*", "Shouldly", "Testcontainers.*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
